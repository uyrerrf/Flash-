services:
  - type: web
    name: nexus-c2
    env: node
    plan: starter
    buildCommand: npm install --omit=dev --no-audit
    startCommand: node server/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /opt/render/project/src/data/nexus.db
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
    disk:
      name: nexus-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
