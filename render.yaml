services:

- type: web
  name: nexus-c2
  env: node
  plan: free
  buildCommand: npm install --omit=dev --no-audit
  startCommand: node server/index.js
  healthCheckPath: /health
  envVars:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: 10000
  - key: DATABASE_URL
    fromDatabase:
      name: nexus-db
      property: connectionString
  - key: SESSION_SECRET
    generateValue: true
  - key: ADMIN_USER
    sync: false        # ← prompts during blueprint deploy
  - key: ADMIN_PASS
    sync: false        # ← prompts during blueprint deploy
  - key: DEVICE_SECRET
    generateValue: true

databases:
- name: nexus-db
  plan: free

  
