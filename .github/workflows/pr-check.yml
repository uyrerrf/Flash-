name: PR Check

# ── Trigger ───────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android-rat/**'

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: android-rat

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-lint-${{ runner.os }}-${{ hashFiles('android-rat/**/*.gradle*') }}
          restore-keys: |
            gradle-lint-${{ runner.os }}-
            gradle-${{ runner.os }}-

      - name: Run Android Lint
        run: |
          ./gradlew lintDebug \
            -PSERVER_URL="wss://localhost:3000" \
            -PSKIP_PARANOID=true \
            --no-daemon \
            --continue
        env:
          GRADLE_OPTS: "-Xmx3g"

      - name: Upload lint results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-results-pr-${{ github.event.pull_request.number }}
          path: android-rat/app/build/reports/lint-results-debug.html
          retention-days: 7

  compile-check:
    name: Compile Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: lint

    defaults:
      run:
        working-directory: android-rat

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-compile-${{ runner.os }}-${{ hashFiles('android-rat/**/*.gradle*') }}
          restore-keys: |
            gradle-compile-${{ runner.os }}-

      # compileDebugJavaSources is faster than assembleDebug — just checks the Java compiles
      - name: Compile check
        run: |
          ./gradlew compileDebugJavaSources \
            -PSERVER_URL="wss://localhost:3000" \
            -PSKIP_PARANOID=true \
            --no-daemon
        env:
          GRADLE_OPTS: "-Xmx3g"
