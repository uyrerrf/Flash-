<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus C2 — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:     #08080f;
      --bg-1:   #0d0d1a;
      --bg-2:   #111122;
      --border: #1e1e3a;
      --text-0: #e8e8ff;
      --text-1: #9999cc;
      --text-2: #555588;
      --accent: #7c6af7;
      --green:  #3dba7a;
      --red:    #e05c5c;
      --font: 'SF Pro Display', 'Inter', system-ui, sans-serif;
      --mono: 'SF Mono', 'JetBrains Mono', monospace;
    }
    html, body { height: 100%; background: var(--bg); color: var(--text-0); font-family: var(--font); font-size: 14px; }
    .wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card {
      background: var(--bg-1);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg, #7c6af7, #aa55cc);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 22px; margin-bottom: 12px;
    }
    .logo-name { font-size: 20px; font-weight: 700; letter-spacing: 0.05em; }
    .logo-sub  { font-size: 11px; color: var(--text-2); font-family: var(--mono); margin-top: 2px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 11px; font-weight: 600; color: var(--text-1); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 6px; }
    input {
      width: 100%; background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 7px; padding: 10px 12px; color: var(--text-0);
      font-family: var(--mono); font-size: 13px; outline: none; transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    .btn {
      width: 100%; background: var(--accent); color: #fff;
      border: none; border-radius: 7px; padding: 11px;
      font-family: var(--font); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-top: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .err { background: rgba(224,92,92,0.1); border: 1px solid rgba(224,92,92,0.3); border-radius: 7px; padding: 10px 12px; font-size: 12px; color: var(--red); margin-top: 12px; display: none; }
    .err.show { display: block; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">⬡</div>
        <div class="logo-name">NEXUS C2</div>
        <div class="logo-sub">Command &amp; Control v6.0</div>
      </div>
      <form id="form">
        <div class="form-group">
          <label>Username</label>
          <input id="u" type="text" autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input id="p" type="password" autocomplete="current-password">
        </div>
        <button class="btn" type="submit" id="btn">Sign In</button>
        <div class="err" id="err"></div>
      </form>
    </div>
  </div>
  <script>
    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('err');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      err.className = 'err';
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user: document.getElementById('u').value, pass: document.getElementById('p').value }),
        });
        const data = await res.json();
        if (data.ok) { location.href = '/'; return; }
        throw new Error(data.error || 'Login failed');
      } catch (ex) {
        err.textContent = ex.message;
        err.className = 'err show';
      }
      btn.disabled = false;
      btn.textContent = 'Sign In';
    });
  </script>
</body>
</html>
