<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS — Access</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080f;color:#d0d0e0;font-family:'Segoe UI',system-ui,sans-serif;
  height:100vh;display:flex;align-items:center;justify-content:center}
.box{background:#10101a;border:1px solid #1c1c2e;border-radius:12px;padding:44px;width:360px}
.logo{text-align:center;margin-bottom:32px}
.logo-mark{font-size:26px;font-weight:800;letter-spacing:3px;color:#fff}
.logo-mark span{color:#7c6af7}
.logo-sub{font-size:11px;color:#44445a;letter-spacing:4px;margin-top:4px;text-transform:uppercase}
.field{margin-bottom:18px}
label{display:block;font-size:11px;color:#555;letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
input{width:100%;background:#0c0c16;border:1px solid #222238;border-radius:7px;
  padding:11px 14px;color:#d0d0e0;font-size:14px;outline:none;transition:.2s}
input:focus{border-color:#7c6af7;box-shadow:0 0 0 3px rgba(124,106,247,.12)}
button{width:100%;background:#7c6af7;color:#fff;border:none;border-radius:7px;
  padding:12px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.5px;
  margin-top:4px;transition:.2s}
button:hover{background:#6b5ce7;transform:translateY(-1px)}
button:active{transform:translateY(0)}
.err{color:#e05c5c;font-size:12px;margin-top:12px;text-align:center;min-height:16px}
</style>
</head><body>
<div class="box">
  <div class="logo">
    <div class="logo-mark">NEX<span>US</span></div>
    <div class="logo-sub">Command & Control</div>
  </div>
  <div class="field"><label>Username</label>
    <input id="u" type="text" autocomplete="username" autofocus></div>
  <div class="field"><label>Password</label>
    <input id="p" type="password" autocomplete="current-password"></div>
  <button onclick="login()">Sign In</button>
  <div class="err" id="err"></div>
</div>
<script>
document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
async function login() {
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  const err = document.getElementById('err');
  err.textContent = '';
  try {
    const r = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user: u, pass: p })
    });
    const d = await r.json();
    if (d.ok) { location.href = '/'; }
    else { err.textContent = d.error || 'Login failed'; }
  } catch { err.textContent = 'Connection error'; }
}
</script>
</body></html>
