<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nexus C2</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="app"></div>

  <!-- Command catalog (no dependency on dash state) -->
  <script src="/static/js/commands.js"></script>

  <!-- HVNC renderer (GPU Worker decode pipeline) -->
  <script src="/static/js/hvnc.js"></script>

  <!-- WS client -->
  <script src="/static/js/ws-client.js"></script>

  <!-- Main Vue 3 app -->
  <script src="/static/js/app.js"></script>

  <!-- A11y bypass panel (optional, injected when bypass pane activates) -->
  <script src="/static/js/bypass-panel.js"></script>

  <!-- Screen Reader V2 — hierarchy tree, OCR stream, EDITAR V2 node editor -->
  <script src="/static/js/screen-reader-v2.js"></script>

</html>
