version: '3.9'

services:
  nexus:
    build: .
    container_name: nexus-c2
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - nexus_data:/app/data
    environment:
      NODE_ENV:       production
      PORT:           3000
      DB_PATH:        /app/data/nexus.db
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      ADMIN_USER:     ${ADMIN_USER:-admin}
      ADMIN_PASS:     ${ADMIN_PASS:?ADMIN_PASS is required}
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout:  10s
      retries:  3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  nexus_data:
    driver: local
